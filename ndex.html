<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открой, Арман...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080812;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, #43145e80, transparent 40%),
                radial-gradient(circle at 80% 80%, #122b6780, transparent 40%);
            animation: glow 6s infinite alternate;
        }

        @keyframes glow {
            to {
                filter: hue-rotate(50deg);
            }
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(#b9a6ff 1px, transparent 1px);
            background-size: 70px 70px, 110px 110px;
            background-position: 0 0, 35px 45px;
            opacity: .25;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: min(600px, 100%);
            min-height: 350px;
            padding: 35px 25px;
            border: 1px solid #a18aff50;
            background: #11111de8;
            border-radius: 24px;
            box-shadow: 0 0 70px #7548ff18;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: appear .7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(25px, 5vw, 38px);
            line-height: 1.3;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            color: #c9c6df;
            line-height: 1.8;
            max-width: 460px;
        }

        button {
            margin-top: 28px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #794cff, #bd4dff);
            box-shadow: 0 5px 25px #914cff40;
            transition: .25s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px #914cff80;
        }

        .progress-wrap {
            position: fixed;
            z-index: 5;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #ffffff12;
        }

        .progress {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #794cff, #ff69d4);
            transition: width .4s;
        }

        .counter {
            position: fixed;
            z-index: 3;
            top: 20px;
            right: 22px;
            color: #b9b1d7;
            font-size: 13px;
        }

        .small {
            margin-top: 18px;
            font-size: 12px;
            color: #85819c;
        }

        .final h1 {
            color: #ff7de2;
            font-size: clamp(28px, 7vw, 48px);
            text-shadow: 0 0 30px #ff45ce70;
        }

        .final .emoji {
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            to {
                transform: scale(1.15) rotate(8deg);
            }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="stars"></div>
    <div class="progress-wrap">
        <div class="progress" id="progress"></div>
    </div>

    <div class="counter" id="counter"></div>

    <div class="container">
        <div class="card" id="card">
            <div class="emoji">💌</div>
            <h1>Арман, открой это...</h1>
            <p>
                Я очень долго думал, стоит ли тебе это показывать.
                Пожалуйста, дочитай до самого конца.
            </p>
            <button onclick="start()">Открыть, Арман</button>
            <div class="small">У меня есть кое-что важное для тебя...</div>
        </div>
    </div>

    <script>
        const pages = [
            {
                emoji: "🤔",
                title: "Арман...",
                text: "Я давно хотел тебе кое-что сказать. Но каждый раз, когда собирался, я передумывал."
            },
            {
                emoji: "😶",
                title: "Это непросто...",
                text: "Я долго выбирал подходящий момент. Мне было сложно подобрать правильные слова."
            },
            {
                emoji: "🌙",
                title: "Я много думал...",
                text: "Иногда я даже репетировал перед зеркалом, представляя, как именно тебе это скажу."
            },
            {
                emoji: "📩",
                title: "Ты должен знать...",
                text: "Я писал это сообщение много раз, удалял его и начинал заново. Но сегодня всё изменится."
            },
            {
                emoji: "😳",
                title: "Уже почти...",
                text: "Арман, пожалуйста, не закрывай сайт. Самое главное будет буквально через секунду."
            },
            {
                emoji: "💀",
                title: "АРМАН, ТЫ ГЕЙ 😂",
                text: "АХАХАХАХАХАХА! ТЫ СЕРЬЁЗНО ДОЧИТАЛ ДО КОНЦА?! 😂😂😂",
                final: true
            }
        ];

        let currentPage = -1;
        let timer = null;

        function render(pageIndex) {
            const card = document.getElementById("card");
            const counter = document.getElementById("counter");
            const progress = document.getElementById("progress");

            card.style.animation = "none";
            void card.offsetWidth;
            card.style.animation = "appear .7s ease";

            if (pageIndex >= pages.length) {
                card.innerHTML = `
            <div class="emoji">🤣</div>
            <h1>КОНЕЦ!</h1>
            <p>Арман, ты прошёл весь этот квест ради этого момента 😂</p>
            <button onclick="restart()">Начать заново 🔄</button>
        `;
                counter.textContent = "Квест завершён";
                progress.style.width = "100%";
                return;
            }

            const page = pages[pageIndex];

            card.className = "card" + (page.final ? " final" : "");
            card.innerHTML = `
        <div class="emoji">${page.emoji}</div>
        <h1>${page.title}</h1>
        <p>${page.text}</p>
        <button onclick="nextPage()">
            ${page.final ? "Ну ты и попался 😂" : "Продолжить →"}
        </button>
        <div class="small">
            ${page.final ? "Не обижайся, Арман ❤️" : "Пожалуйста, продолжай читать..."}
        </div>
    `;

            counter.textContent = `Страница ${pageIndex + 1} из ${pages.length}`;
            progress.style.width = ((pageIndex + 1) / pages.length * 100) + "%";
        }

        function start() {
            currentPage = 0;
            render(currentPage);
        }

        function nextPage() {
            currentPage++;

            if (currentPage >= pages.length) {
                render(pages.length);
                return;
            }

            render(currentPage);
        }

        function restart() {
            currentPage = -1;
            document.getElementById("counter").textContent = "";
            document.getElementById("progress").style.width = "0";

            document.getElementById("card").className = "card";
            document.getElementById("card").innerHTML = `
        <div class="emoji">💌</div>
        <h1>Арман, открой это...</h1>
        <p>Я очень долго думал, стоит ли тебе это показывать. Пожалуйста, дочитай до самого конца.</p>
        <button onclick="start()">Открыть, Арман</button>
        <div class="small">У меня есть кое-что важное для тебя...</div>
    `;
        }
    </script>

</body>

</html>
